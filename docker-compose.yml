services:
  postgres:
    image: postgres:16.15-alpine
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      DATABASE_URL:      ${DATABASE_URL}
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-appuser} -d $${POSTGRES_DB:-livestream_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [dev_net]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [dev_net]

volumes:
  pgdata:

networks:
  dev_net:
    driver: bridge